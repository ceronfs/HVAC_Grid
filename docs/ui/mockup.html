<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HVAC Grid · 통합 UI 목업</title>
<style>
:root{--bg:#f5f4ef;--panel:#fff;--line:#dedcd5;--line2:#ecebe6;--text:#292927;--muted:#706f69;--accent:#185fa5;--soft:#e6f1fb;--ok:#2e7d32;--warn:#b26a00;--red:#a32d2d;
 --box:#1f6f8b;--phg:#185fa5;--grid:#7a4fb3;--canvas:#fff;--gridline:#efeee9}
html[data-theme=dark]{--bg:#0d1726;--panel:#132033;--line:#344861;--line2:#22344b;--text:#edf4ff;--muted:#9fb0c7;--accent:#35b5ef;--soft:#143754;--canvas:#07111f;--gridline:#1c2b40}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:11px system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:44px 74px minmax(0,1fr) 24px}
/* app bar */
.bar{display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;white-space:nowrap}
.brand .brand-logo{width:30px;height:30px;flex:none;display:block}.brand b{color:#29a9ff;font-weight:700}
.brand small{font-weight:400;color:var(--muted);font-size:11px}
.proj{padding:4px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);white-space:nowrap}
.steps{display:flex;gap:2px;margin:0 auto;background:var(--bg);padding:3px;border-radius:8px;border:1px solid var(--line)}
.step{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted)}
.step b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);font-size:10px;background:var(--panel);color:var(--muted)}
.step[aria-pressed=true]{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.step[aria-pressed=true] b{background:var(--accent);border-color:var(--accent);color:#fff}
.step .src{font-size:9px;padding:0 4px;border-radius:3px;background:var(--soft);color:var(--accent)}
.baricons{display:flex;gap:4px}
.ib{width:30px;height:30px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--soft);color:var(--accent)}
/* ribbon */
.ribbon{display:flex;align-items:stretch;gap:4px;padding:4px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow:hidden}
.grp{display:grid;grid-template-rows:auto 12px;padding:2px 6px 1px;border-left:1px solid var(--line2);position:relative}
.grp:first-child{border-left:0}
.grp .btns{display:flex;gap:1px}
.cmd{width:auto;min-width:40px;height:44px;padding:2px 4px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cmd:hover{background:var(--soft);border-color:#cfe3f6}
.cmd svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cmd span{font-size:10px;white-space:nowrap;color:var(--text)}
.cmd.new{outline:1px dashed var(--grid);outline-offset:-2px}
.grp .cap{font-size:10px;color:var(--muted);text-align:center;white-space:nowrap}
.tag{position:absolute;right:4px;top:-1px;font-size:8px;padding:0 3px;border-radius:3px;color:#fff}
.tag.box{background:var(--box)}.tag.phg{background:var(--phg)}.tag.grid{background:var(--grid)}
/* main */
.main{display:grid;grid-template-columns:240px minmax(0,1fr) 280px;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side.right{border-right:0;border-left:1px solid var(--line)}
.sh{padding:8px 10px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;font-weight:600}
.sh small{font-weight:400;color:var(--muted)}
.search{margin:8px 10px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
.chips{display:flex;gap:4px;flex-wrap:wrap;padding:0 10px 8px}
.chip{padding:2px 7px;border:1px solid var(--line);border-radius:10px;background:none;cursor:pointer;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.tree{overflow:auto;flex:1;padding-bottom:10px}
.deck{border-top:1px solid var(--line2)}
.deckh{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;font-weight:600}
.deckh[aria-current=true]{background:var(--soft);color:var(--accent)}
.deckh small{margin-left:auto;font-weight:400;color:var(--muted)}
.room{display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:center;padding:4px 10px 4px 22px;cursor:pointer}
.room:hover{background:var(--bg)}.room[aria-selected=true]{background:var(--soft)}
.room .no{color:var(--muted);font-variant-numeric:tabular-nums}
.room .cmh{font-variant-numeric:tabular-nums;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
/* canvas */
.center{position:relative;min-width:0;min-height:0;background:var(--canvas);
 background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);background-size:20px 20px}
.center svg.plan{position:absolute;inset:0;width:100%;height:100%}
.float{position:absolute;left:12px;top:12px;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.float button{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:4px 9px;cursor:pointer}
.float button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.legend{position:absolute;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:420px;box-shadow:0 2px 8px rgba(0,0,0,.08);line-height:1.6}
.note{position:absolute;left:12px;bottom:12px;background:#1f4f7a;color:#fff;border-radius:8px;padding:8px 12px;max-width:560px;line-height:1.5}
.plan .rm{stroke:#5b6b7a;stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer}
.plan .rm.sel{stroke:var(--red);stroke-width:2.5}
.plan text{font:11px system-ui,"Noto Sans KR";fill:var(--text);pointer-events:none}
.plan .duct{fill:none;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round}
.plan .ru{fill:#e6b3ff;stroke:#7a4fb3;stroke-width:1.2;vector-effect:non-scaling-stroke}
.plan .root{fill:var(--red)}
/* inspector */
.insp{overflow:auto;flex:1;padding:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px;background:var(--panel)}
.card h4{margin:0 0 6px;font-size:11px;display:flex;justify-content:space-between;align-items:center}
.card h4 .tag{position:static}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 8px}
.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.bar2{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;margin-top:4px}.bar2 i{display:block;height:100%;background:var(--accent)}
.status{display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);white-space:nowrap;overflow:hidden}
.status b{color:var(--text);font-weight:600}
.ok{color:var(--ok)}.warn{color:var(--warn)}
</style>
</head>

  </section>

   <div class="sh" id="inspTitle">속성</div>
   <div class="insp" id="insp"></div>
  </aside>
 </div>
 <footer class="status" id="status"></footer>
</div>

 $('legend').innerHTML=S.step==='load'?'<b>냉방 현열</b> — 진할수록 큼 (BOX CAL 결과)':S.step==='room'?'<b>격실</b> — BOX 도형에서 인식한 실(외곽선·번호·이름)':
  `<b>급기 계통</b><br>${[...new Set(rooms.map(r=>r.systems.supply).filter(Boolean))].map(id=>`<span class="dot" style="background:${sysColor(id)}"></span>${id} · ${DATA.systems.find(s=>s.id===id&&s.kind==='supply')?.designCmh.toLocaleString()} CMH`).join('<br>')}${S.step!=='air'?`<br><small>${nets.length?'덕트: PHG D AUTO 결과 (H1 생성)':'이 Deck은 덕트 미생성 — 데모 데이터는 3DK'}</small>`:''}`;
 const notes={room:'① 도면·격실: BOX의 CAD·격실 인식 기능을 이 리본으로 씁니다. 왼쪽 트리는 BOX Deck 적층 + 격실 목록을 합친 것입니다.',load:'② 부하: BOX CAL(설계 조건·K값·부하·신기·리히터)이 같은 화면 안에서 열립니다. 별도 전체 화면 창 대신 속성 패널에 결과가 바로 보입니다.',
  air:'③ 풍량·계통 (신규): 격실 부하 → 급기·배기·환기 풍량, 계통 배정, 공조기 위치를 정합니다. HVAC Grid 계약(hvac-grid/0)이 이 단계의 데이터입니다.',duct:'④ RU·덕트: PHG D의 리본·AUTO·계산을 그대로 씁니다. 풍량은 BOX 부하에서 오고, RU는 실마다 자동 배치됩니다.',review:'⑤ 검토·출력 (신규): 풍속·압력·소음·방화(SOLAS) 검토와 통합 출력입니다.'};
 $('note').textContent=notes[S.step];}
function inspector(){const r=DATA.rooms.find(x=>x.id===S.room);
 if(!r){const deckRooms=DATA.rooms.filter(x=>x.deckId===S.deck),sum=k=>deckRooms.reduce((t,x)=>t+(DATA.airflow[x.id][k]||0),0),cool=deckRooms.reduce((t,x)=>t+DATA.loads[x.id].coolingSensibleW,0);
  const nets=DATA.networks.filter(n=>n.deckId===S.deck);
  $('inspTitle').innerHTML='Deck '+esc(DATA.decks.find(d=>d.id===S.deck).name);
  $('insp').innerHTML=`<div class="card"><h4>Deck 요약</h4><div class="kv"><span>격실</span><span>${deckRooms.length}</span><span>냉방 현열</span><span>${Math.round(cool).toLocaleString()} W</span><span>급기 합계</span><span>${sum('supplyCmh').toLocaleString()} CMH</span><span>배기 합계</span><span>${sum('exhaustCmh').toLocaleString()} CMH</span></div></div>`+
   nets.map(n=>`<div class="card"><h4><span><span class="dot" style="background:${sysColor(n.systemId)}"></span>${esc(n.systemId)}</span><span class="tag phg">PHG D</span></h4><div class="kv"><span>RU</span><span>${n.rus.length}개</span><span>덕트</span><span>${n.lengthM} m</span><span>최대 압력손실</span><span>${n.indexPa} Pa</span><span>공조기 위치</span><span class="${/assumed/.test(n.rootSource)?'warn':''}">${/assumed/.test(n.rootSource)?'임시 (복도 끝)':'팬룸'}</span></div></div>`).join('')+
   `<div class="card"><h4>선택</h4><span style="color:var(--muted)">왼쪽 트리나 도면에서 격실을 고르면 부하·풍량·덕트가 여기에 모입니다.</span></div>`;return;}
 const L=DATA.loads[r.id],A=DATA.airflow[r.id],net=DATA.networks.find(n=>n.deckId===r.deckId&&n.systemId===r.systems.supply),rus=net?net.rus.filter(u=>u.roomId===r.id):[];
 $('inspTitle').innerHTML=`${esc(r.no)} ${esc(r.name)} <small>${esc(r.isoClass||'')}</small>`;
 const show=k=>({room:['geo','sys'],load:['load','geo'],air:['air','sys','load'],duct:['air','duct','sys'],review:['air','duct','check']}[S.step]||[]).includes(k);
 $('insp').innerHTML=[
  show('load')&&`<div class="card"><h4>부하 <span class="tag box">BOX CAL</span></h4><div class="big">${Math.round(L.coolingSensibleW).toLocaleString()} W</div><div style="color:var(--muted)">냉방 현열</div><div class="kv" style="margin-top:6px"><span>냉방 잠열</span><span>${Math.round(L.coolingLatentW)} W</span><span>냉방 합계</span><span>${Math.round(L.coolingW)} W</span><span>난방</span><span>${Math.round(L.heatingW)} W</span><span>최소 신기</span><span>${L.minFreshAirCmh} CMH</span><span>상태</span><span class="${L.complete?'ok':'warn'}">${esc(L.status||'')}</span></div></div>`,
  show('air')&&`<div class="card"><h4>풍량 <span class="tag grid">계약 v0</span></h4><div class="kv"><span>급기</span><span><b>${A.supplyCmh}</b> CMH</span><span>배기</span><span>${A.exhaustCmh} CMH</span><span>환기</span><span>${A.returnCmh} CMH</span><span>신기(정보)</span><span>${A.freshAirCmh} CMH</span></div><div style="color:var(--muted);margin-top:6px">급기 = ⌈현열 × 3 ÷ ${DATA.rules.supplyDeltaTK} K⌉ · 배기 = ⌈ACH × 체적⌉</div></div>`,
  show('sys')&&`<div class="card"><h4>계통</h4><div class="kv"><span>급기</span><span>${r.systems.supply?`<span class="dot" style="background:${sysColor(r.systems.supply)}"></span>${esc(r.systems.supply)}`:'—'}</span><span>배기</span><span>${esc(r.systems.exhaust||'—')}</span><span>환기</span><span>${esc(r.systems.return||'—')}</span></div></div>`,
  show('duct')&&`<div class="card"><h4>RU·덕트 <span class="tag phg">PHG D</span></h4>${net?`<div class="kv"><span>RU</span><span>${rus.length}개 · ${rus.reduce((t,u)=>t+u.flowCmh,0)} CMH</span><span>계통 덕트</span><span>${net.lengthM} m</span><span>계통 최대 압력손실</span><span>${net.indexPa} Pa</span></div>`:'<span style="color:var(--muted)">이 계통의 덕트는 아직 만들지 않았습니다 (데모: 3DK)</span>'}</div>`,
  show('geo')&&`<div class="card"><h4>형상 <span class="tag box">BOX</span></h4><div class="kv"><span>면적</span><span>${r.areaM2.toFixed(1)} m²</span><span>체적</span><span>${r.volumeM3.toFixed(1)} m³</span><span>외곽 꼭짓점</span><span>${r.polygon.length}</span></div></div>`,
  show('check')&&`<div class="card"><h4>검토 <span class="tag grid">신규</span></h4><div class="kv"><span>풍속</span><span class="ok">기준 이내</span><span>방화 경계 관통</span><span class="warn">SOLAS 단계에서 판정</span></div></div>`].filter(Boolean).join('');}
function status(){const st=STEPS.findIndex(s=>s.id===S.step)+1,sup=DATA.systems.filter(s=>s.kind==='supply');
 $('status').innerHTML=`<span>단계 <b>${st}/5</b> ${STEPS[st-1].name}</span><span>Deck <b>${DATA.decks.length}</b> · 격실 <b>${DATA.rooms.length}</b></span><span>급기 계통 <b>${sup.length}</b> · <b>${sup.reduce((t,s)=>t+s.designCmh,0).toLocaleString()}</b> CMH</span><span>덕트망 <b>${DATA.networks.length}</b>/${sup.length} (데모)</span><span style="margin-left:auto">목업 — 실제 동작 아님 · 데이터: BOX CAL S5 예제 + PHG D 생성 결과</span>`;}
function render(){steps();ribbon();tree();plan();inspector();status();}
$('q').oninput=()=>tree();$('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'':'dark';};
render();
</script>
</body>
</html>
